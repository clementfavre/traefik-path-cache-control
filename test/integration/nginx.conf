server {
    listen 80;
    root /usr/share/nginx/html;

    # Backend sends its own header, like most apps do
    add_header Cache-Control "no-cache";

    location = /media/old.jpg {
        return 302 /media/photo.jpg;
    }

    location = /media/upload {
        return 200 "ok";
    }

    # Mixed case path, like on an IIS backend
    location = /Media/Photo.JPG {
        return 200 "ok";
    }
}
